# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-version-updates

version: 2
updates:
  # Root workspace package.json (pnpm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "America/Los_Angeles"
    # Allow up to 10 open PRs at a time for version updates
    open-pull-requests-limit: 10
    # Group all minor/patch updates together to reduce noise
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Labels for PRs
    labels:
      - "dependencies"
      - "security"
    # Automatically rebase PRs
    rebase-strategy: "auto"
    # Target the main branch
    target-branch: "main"
    # Allow Dependabot to auto-merge security updates
    allow:
      - dependency-type: "all"
    # Register reviewers for security updates
    reviewers:
      - "Mgfromthe503"
    # Security-specific settings
    insecure-external-code-execution: "deny"

  # App workspace package.json (packages/app)
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "security"
    rebase-strategy: "auto"
    target-branch: "main"
    allow:
      - dependency-type: "all"
    reviewers:
      - "Mgfromthe503"
    insecure-external-code-execution: "deny"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
