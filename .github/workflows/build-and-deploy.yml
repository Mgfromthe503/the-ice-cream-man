name: Build and Deploy to Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-build
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: EAS Build + Submit to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          NODE_ENV: development

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Write Google service account key
        if: "${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY != '' }}"
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > ./google-service-account.json

      - name: EAS Build (production .aab)
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
          EAS_SKIP_AUTO_FINGERPRINT: "1"
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Submit to Google Play (Internal Track)
        if: "${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY != '' }}"
        run: eas submit --platform android --profile production --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Remove service account key
        if: always()
        run: rm -f ./google-service-account.json
